<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liên đội Trường Tiểu học Tân Châu – An Giang</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f2e9;font-family:Arial,sans-serif}
#stage{position:relative;width:min(100%,1536px);margin:auto;box-shadow:0 0 20px #0002}
#original{display:block;width:100%;height:auto}
.layer{position:absolute;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere}
.layer a{color:inherit;text-decoration:inherit}
#error{display:none;background:#fff3cd;padding:18px;text-align:center;color:#8b3300}
</style></head><body>
<div id="error">Không tìm thấy file <b>giao-dien-goc.png</b>. Hãy tải ảnh cùng thư mục với <b>index.html</b> lên GitHub.</div>
<main id="stage"><img id="original" src="./giao-dien-goc.png" width="1536" height="1024" alt="Giao diện Liên đội Trường Tiểu học Tân Châu – An Giang"></main>
<script>
const stage=document.getElementById('stage'),img=document.getElementById('original');
img.addEventListener('error',()=>document.getElementById('error').style.display='block');
function render(layers){
stage.querySelectorAll('.layer').forEach(e=>e.remove());
for(const item of layers){if(!item||!item.type)continue;
const el=document.createElement('div');el.className='layer';
el.style.left=(Number(item.x)||0)/1536*100+'%';el.style.top=(Number(item.y)||0)/1024*100+'%';
el.style.width=(Number(item.w)||100)/1536*100+'%';el.style.height=(Number(item.h)||40)/1024*100+'%';
el.style.zIndex=Number(item.z)||1;
if(item.type==='text'){el.style.fontSize='clamp(7px,'+(Number(item.font)||24)/1536*100+'vw,48px)';el.style.color=item.color||'#111';el.style.fontWeight=item.bold?'bold':'normal';el.style.background=item.bg||'transparent';el.style.padding='3px';el.textContent=item.text||''}
if(item.type==='cover'){el.style.background=item.bg||'#fff'}
if(item.type==='image'){const image=document.createElement('img');image.src=item.src||'';image.style.cssText='width:100%;height:100%;object-fit:fill';el.appendChild(image)}
if(item.url){const a=document.createElement('a');a.href=item.url;a.style.cssText='position:absolute;inset:0;display:block';a.setAttribute('aria-label',item.text||'Mở liên kết');el.appendChild(a)}
stage.appendChild(el)
}}
fetch('./site-data.json?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>render(Array.isArray(data.layers)?data.layers:[])).catch(()=>render([]));
</script></body></html>
