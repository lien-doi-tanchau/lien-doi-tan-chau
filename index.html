vent-date"><strong>${safe(e.day)}</strong><small>${safe(e.month)}</small></span><span class="item-main"><b>${safe(e.title)}</b><small>◷ ${safe(e.time)} &nbsp; 📍 ${safe(e.place)}</small></span><span class="right-arrow">›</span></button>`}function home(){const s=DATA.stats;return `<img class="hero" src="assets/banner.jpg" alt="Vì đàn em thân yêu – Bác Hồ và thiếu nhi Tân Châu"><div class="stat-grid"><div class="stat"><div class="stat-icon">♟</div><div><strong>${safe(s.members)}</strong><b>Đội viên</b><small>Toàn Liên đội</small></div></div><div class="stat"><div class="stat-icon">♧</div><div><strong>${safe(s.teams)}</strong><b>Chi đội</b><small>Khối 4, 5</small></div></div><div class="stat"><div class="stat-icon">📍</div><div><strong>${safe(s.campuses)}</strong><b>Điểm trường</b><small>Trường chính + 2 phân hiệu</small></div></div><div class="stat"><div class="stat-icon">▣</div><div><strong>${safe(s.activities)}</strong><b>Hoạt động</b><small>Năm học 2026 - 2027</small></div></div></div><div class="panels"><section class="panel"><div class="panel-title"><span>📢 &nbsp;Tin tức - Thông báo</span><button data-goto="news">Xem tất cả →</button></div>${DATA.news.slice(0,3).map(newsCard).join('')}</section><section class="panel"><div class="panel-title"><span>▦ &nbsp;Lịch hoạt động sắp tới</span><button data-goto="calendar">Xem tất cả →</button></div>${DATA.events.slice(0,3).map(eventCard).join('')}</section></div><section class="quick"><strong>◉ Truy cập nhanh</strong><div class="quick-links">${[['members','♟','Danh sách Đội viên'],['activities','▦','Kế hoạch Hoạt động'],['training','★','Rèn luyện Đội viên'],['awards','🏆','Thi đua Khen thưởng'],['records','▣','Hồ sơ điện tử'],['reports','▥','Báo cáo Thống kê']].map(([id,ico,label])=>`<button class="quick-link" data-goto="${id}"><span>${ico}</span><small>${label}</small></button>`).join('')}</div></section>`}function listing(page){const title=page==='news'?'Tin tức - Thông báo':'Lịch hoạt động';const items=page==='news'?DATA.news.map(newsCard):DATA.events.map(eventCard);return `<div class="page-heading"><h1>${title}</h1><p>Liên đội Trường Tiểu học Tân Châu – An Giang</p></div><section class="section-card">${items.join('')||'<p>Chưa có nội dung.</p>'}</section>`}function section(page){const info=MENUS.find(x=>x[0]===page),title=info?info[2]:'Nội dung';return `<div class="page-heading"><h1>${safe(title)}</h1><p>Năm học 2026 – 2027</p></div>${(DATA.sections[page]||[]).map(item=>`<article class="section-card"><h2>${safe(item.title)}</h2><p>${safe(item.detail)}</p>${item.url?`<a href="${safe(item.url)}" target="_blank" rel="noopener noreferrer">Mở tài liệu →</a>`:''}</article>`).join('')||'<div class="section-card">Chưa có nội dung. Người quản trị có thể bổ sung dữ liệu.</div>'}`}function detail(type,id){let item=type==='news'?DATA.news.find(x=>x.id===id):DATA.events.find(x=>x.id===id);if(!item)return '<div class="section-card">Không tìm thấy nội dung.</div>';return `<button class="detail-back" data-goto="${type==='news'?'news':'calendar'}">← Quay lại</button><article class="section-card"><h2>${safe(item.title)}</h2><p class="muted">${type==='news'?'📅 '+safe(item.date):'📅 '+safe(item.day)+' '+safe(item.month)+' · '+safe(item.time)+' · '+safe(item.place)}</p><p>${safe(item.detail||'Nội dung chi tiết đang được cập nhật.')}</p></article>`}function adminInfo(){return `<div class="page-heading"><h1>Quản trị hệ thống</h1><p>Công cụ cập nhật nội dung website</p></div><div class="section-card"><h2>Chỉnh sửa nội dung</h2><p>Để chỉnh sửa dữ liệu, mở file <b>admin.html</b> trên máy tính. Sau khi chỉnh sửa, xuất file <b>site-data.json</b> và tải lên GitHub để công khai thay đổi.</p><p class="admin-note">GitHub Pages không có hệ thống đăng nhập bảo mật. Quyền cập nhật file website do tài khoản GitHub có quyền ghi vào kho quản lý. Không đăng dữ liệu cá nhân học sinh lên website công khai.</p></div>`}function render(){if(!DATA)return;menu();const path=(location.hash.slice(1)||'home').split('/');const p=path[0];el('content').innerHTML=p==='home'?home():p==='news'||p==='calendar'?listing(p):p==='news-detail'?detail('news',path[1]):p==='event-detail'?detail('event',path[1]):p==='admin'?adminInfo():section(p);el('content').querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>go(b.dataset.goto));el('content').querySelectorAll('[data-news]').forEach(b=>b.onclick=()=>go('news-detail/'+b.dataset.news));el('content').querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>go('event-detail/'+b.dataset.event))}window.addEventListener('hashchange',render);fetch('site-data.json?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Không đọc được site-data.json');return r.json()}).then(d=>{DATA=d;render()}).catch(e=>{el('loading').innerHTML=`<div class="section-card"><h2>Không tải được dữ liệu website</h2><p>${safe(e.message)}</p><p>Kiểm tra file <b>site-data.json</b> nằm cùng thư mục với <b>index.html</b> trên GitHub. Không mở index.html trực tiếp bằng đường dẫn file://; hãy chạy qua GitHub Pages hoặc máy chủ cục bộ.</p></div>`});</script><script src="auth-config.js"></script><script type="module" src="auth-widget.js"></script></body></html>
